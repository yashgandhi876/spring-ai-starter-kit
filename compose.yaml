# Local stack: Postgres with pgvector and Ollama.
#   docker compose up -d                 starts Postgres and Ollama; run the app with ./gradlew bootRun
#   docker compose --profile app up -d   also builds and runs the app itself on http://localhost:8080
# Needs Docker Compose 2.24 or newer (check with: docker compose version).
# Port 5432 or 11434 already taken on your machine? Set DB_PORT or OLLAMA_PORT in .env or your shell;
# ./gradlew bootRun reads the same variables.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: starterkit
      POSTGRES_USER: starterkit
      POSTGRES_PASSWORD: starterkit
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starterkit -d starterkit"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama

  app:
    profiles: ["app"]
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/starterkit
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  pgdata:
  ollama:
